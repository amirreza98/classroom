services:
  backend:
    build: ./classroom-backend
    ports:
      - "8000:8000"
    env_file:
      - ./classroom-backend/.env
    platform: linux/arm64
    image: classroom-backend:latest

  frontend:
    build:
      context: ./classroom-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    env_file:
      - ./classroom-frontend/.env
    volumes:
      - ./classroom-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    platform: linux/arm64
    image: classroom-frontend:latest

  voice-service:
    build: ./voice-service
    ports:
      - "3001:3001"
    env_file:
      - ./voice-service/.env
    platform: linux/arm64
    image: classroom-voice:latest