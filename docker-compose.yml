services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - classroom-network

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    networks:
      - classroom-network

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EXPRESS_SERVICE_URL: http://auth-service:8000
      ACADEMIC_SERVICE_URL: http://academic-service:8001
      VOICE_SERVICE_URL: http://voice-service:3001
      NOTIFICATION_SERVICE_URL: http://notifications-service:8082
      COLLABORATION_SERVICE_URL: http://collaboration-service:8083
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWK_SET_URI: http://auth-service:8000/api/auth/jwks
    depends_on:
      - redis
      - kafka
      - auth-service
    networks:
      - classroom-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8000:8000"
    env_file:
      - ./auth-service/.env
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
      - redis
    networks:
      - classroom-network

  academic-service:
    build: ./academic-service
    container_name: academic-service
    ports:
      - "8001:8001"
    environment:
      SERVER_PORT: 8001
      KAFKA_BROKER: kafka:9092
      AUTH_SERVICE_URL: http://auth-service:8000
      DATABASE_URL: ${ACADEMIC_DATABASE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      - kafka
      - redis
      - auth-service
    networks:
      - classroom-network
      
  notifications-service:
    build: ./notifications-service
    container_name: notifications-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
    networks:
      - classroom-network

  voice-service:
    build: ./voice-service
    container_name: voice-service
    ports:
      - "3001:3001"
    env_file:
      - ./voice-service/.env
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
    networks:
      - classroom-network

  collaboration-service:
    build: ./collaboration-service
    container_name: collaboration-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: ${COLLABORATION_DATABASE_URL}
    depends_on:
      - redis
    networks:
      - classroom-network

networks:
  classroom-network:
    driver: bridge