spring.application.name=notifications-service
server.port=${SERVER_PORT:8082}

# Database — set DATABASE_URL as a JDBC URL in the environment
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/notifications_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.maximum-pool-size=5

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always