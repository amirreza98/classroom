server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service

  security:
    oauth2:
      resourceserver:
        jwt:
          # Better Auth exposes its public keys at /api/auth/jwks (ES256)
          # Set JWK_SET_URI=http://backend:8000/api/auth/jwks in docker-compose
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8000/api/auth/jwks}

  cloud:
    gateway:
      # Routes are matched top-to-bottom; specific paths must come before the /api/** catch-all
      routes:
        - id: auth-service
          uri: ${EXPRESS_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/auth/**

        - id: voice-service
          uri: ${VOICE_SERVICE_URL:http://localhost:3001}
          predicates:
            - Path=/api/voice/**

        - id: voice-books
          uri: ${VOICE_SERVICE_URL:http://localhost:3001}
          predicates:
            - Path=/api/books/**

        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/analytics/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/notifications/**

        - id: collaboration-service
          uri: ${COLLABORATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/collaboration/**

        # Catch-all for the Express CRUD backend — must be last
        - id: crud-service
          uri: ${EXPRESS_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true