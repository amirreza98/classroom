server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8000/api/auth/jwks}

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-service
          uri: ${EXPRESS_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/auth/**

        - id: voice-service
          uri: ${VOICE_SERVICE_URL:http://localhost:3001}
          predicates:
            - Path=/api/voice/**

        - id: voice-books
          uri: ${VOICE_SERVICE_URL:http://localhost:3001}
          predicates:
            - Path=/api/books/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/notifications/**

        - id: collaboration-websocket
          uri: ${COLLABORATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/ws/collaboration/**
          filters:
            - RewritePath=/ws/(?<rest>.*), /${rest}

        - id: collaboration-service
          uri: ${COLLABORATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/collaboration/**
          filters:
            - StripPrefix=1

        - id: academic-service
          uri: ${ACADEMIC_SERVICE_URL:http://localhost:8001}
          predicates:
            - Path=/api/departments/**,/api/subjects/**,/api/classes/**,/api/enrollments/**,/api/payments/**,/api/grades/**,/api/student-dashboard/**,/api/stripe/**,/api/dashboard/**

        - id: users-service
          uri: ${EXPRESS_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/users/**

        # Catch-all for Express auth backend
        - id: crud-service
          uri: ${EXPRESS_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true