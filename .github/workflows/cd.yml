name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - run: echo "Proceeding with deployment"

  detect-changes:
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.backend }}
      gateway: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.gateway }}
      voice: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.voice }}
      analytics: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.analytics }}
      notifications: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.notifications }}
      collaboration: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.collaboration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'classroom-backend/**'
            gateway:
              - 'gateway-service/**'
            voice:
              - 'voice-service/**'
            analytics:
              - 'analytics-service/**'
            notifications:
              - 'notifications-service/**'
            collaboration:
              - 'collaboration-service/**'

  build-and-push-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./classroom-backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-backend:latest

  build-and-push-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: cd gateway-service && ./mvnw clean package -DskipTests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./gateway-service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-gateway-service:latest

  build-and-push-voice-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.voice == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./voice-service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-voice-service:latest

  build-and-push-analytics-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.analytics == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: cd analytics-service && ./mvnw clean package -DskipTests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./analytics-service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-analytics-service:latest

  build-and-push-notifications-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.notifications == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: cd notifications-service && ./mvnw clean package -DskipTests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./notifications-service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-notifications-service:latest

  build-and-push-collaboration-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.collaboration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: cd collaboration-service && ./mvnw clean package -DskipTests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./collaboration-service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-collaboration-service:latest

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs:
      - build-and-push-backend
      - build-and-push-gateway
      - build-and-push-voice-service
      - build-and-push-analytics-service
      - build-and-push-notifications-service
      - build-and-push-collaboration-service
    if: |
      always() && (
        needs.build-and-push-backend.result == 'success' ||
        needs.build-and-push-gateway.result == 'success' ||
        needs.build-and-push-voice-service.result == 'success' ||
        needs.build-and-push-analytics-service.result == 'success' ||
        needs.build-and-push-notifications-service.result == 'success' ||
        needs.build-and-push-collaboration-service.result == 'success'
      )
    steps:
      - uses: actions/checkout@v4
      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/classroom/"
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd classroom
            sed -i 's|build: ./classroom-backend|image: ${{ secrets.DOCKER_USERNAME }}/classroom-backend:latest|g' docker-compose.yml
            sed -i 's|build: ./gateway-service|image: ${{ secrets.DOCKER_USERNAME }}/classroom-gateway-service:latest|g' docker-compose.yml
            sed -i 's|build: ./voice-service|image: ${{ secrets.DOCKER_USERNAME }}/classroom-voice-service:latest|g' docker-compose.yml
            sed -i 's|build: ./analytics-service|image: ${{ secrets.DOCKER_USERNAME }}/classroom-analytics-service:latest|g' docker-compose.yml
            sed -i 's|build: ./notifications-service|image: ${{ secrets.DOCKER_USERNAME }}/classroom-notifications-service:latest|g' docker-compose.yml
            sed -i 's|build: ./collaboration-service|image: ${{ secrets.DOCKER_USERNAME }}/classroom-collaboration-service:latest|g' docker-compose.yml
            docker compose pull
            docker compose up -d --force-recreate
            sleep 10