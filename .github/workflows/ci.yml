name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      gateway: ${{ steps.changes.outputs.gateway }}
      voice: ${{ steps.changes.outputs.voice }}
      analytics: ${{ steps.changes.outputs.analytics }}
      notifications: ${{ steps.changes.outputs.notifications }}
      collaboration: ${{ steps.changes.outputs.collaboration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'classroom-backend/**'
            frontend:
              - 'classroom-frontend/**'
            gateway:
              - 'gateway-service/**'
            voice:
              - 'voice-service/**'
            analytics:
              - 'analytics-service/**'
            notifications:
              - 'notifications-service/**'
            collaboration:
              - 'collaboration-service/**'

  # ── Node.js services ────────────────────────────────────────────────────────

  ci-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classroom-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: classroom-backend/package-lock.json
      - run: npm ci
      - name: Type-check & compile
        run: npm run build
      - name: Unit tests
        run: npm test

  ci-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classroom-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: classroom-frontend/package-lock.json
      - run: npm ci
      - name: Type-check & build
        run: npm run build

  ci-voice:
    needs: detect-changes
    if: needs.detect-changes.outputs.voice == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: voice-service/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test -- --passWithNoTests

  # ── Java services ────────────────────────────────────────────────────────────

  ci-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Test gateway service
        working-directory: gateway-service
        run: ./mvnw test
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  ci-analytics:
    needs: detect-changes
    if: needs.detect-changes.outputs.analytics == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analytics_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: bitnami/kafka:latest
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_NODE_ID: '0'
          KAFKA_CFG_PROCESS_ROLES: controller,broker
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          ALLOW_PLAINTEXT_LISTENER: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Test analytics service
        working-directory: analytics-service
        run: ./mvnw test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/analytics_db
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          KAFKA_BROKER: localhost:9092

  ci-notifications:
    needs: detect-changes
    if: needs.detect-changes.outputs.notifications == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notifications_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Test notifications service
        working-directory: notifications-service
        run: ./mvnw test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/notifications_db
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres

  ci-collaboration:
    needs: detect-changes
    if: needs.detect-changes.outputs.collaboration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collaboration_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Test collaboration service
        working-directory: collaboration-service
        run: ./mvnw test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/collaboration_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # ── Summary gate (use this for branch protection rules) ──────────────────────

  ci-success:
    runs-on: ubuntu-latest
    needs:
      - ci-backend
      - ci-frontend
      - ci-voice
      - ci-gateway
      - ci-analytics
      - ci-notifications
      - ci-collaboration
    if: always()
    steps:
      - name: Check all CI jobs passed or were skipped
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$failed" ]; then
            echo "Failed or cancelled jobs: $failed"
            exit 1
          fi
          echo "All CI checks passed or were skipped"
