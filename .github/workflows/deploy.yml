name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'classroom-backend/') ||
      contains(github.event.head_commit.added, 'classroom-backend/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./classroom-backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-backend:latest

  build-and-push-frontend:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'classroom-frontend/') ||
      contains(github.event.head_commit.added, 'classroom-frontend/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./classroom-frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-frontend:latest

  build-and-push-gateway:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'gateway-service/') ||
      contains(github.event.head_commit.added, 'gateway-service/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: |
          cd gateway-service
          ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push gateway service
        uses: docker/build-push-action@v5
        with:
          context: ./gateway-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-gateway-service:latest

  build-and-push-voice-service:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'voice-service/') ||
      contains(github.event.head_commit.added, 'voice-service/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push voice service
        uses: docker/build-push-action@v5
        with:
          context: ./voice-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-voice-service:latest

  build-and-push-analytics-service:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'analytics-service/') ||
      contains(github.event.head_commit.added, 'analytics-service/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: |
          cd analytics-service
          ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push analytics service
        uses: docker/build-push-action@v5
        with:
          context: ./analytics-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-analytics-service:latest

  build-and-push-notifications-service:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'notifications-service/') ||
      contains(github.event.head_commit.added, 'notifications-service/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: |
          cd notifications-service
          ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push notifications service
        uses: docker/build-push-action@v5
        with:
          context: ./notifications-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-notifications-service:latest

  build-and-push-collaboration-service:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'collaboration-service/') ||
      contains(github.event.head_commit.added, 'collaboration-service/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: |
          cd collaboration-service
          ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push collaboration service
        uses: docker/build-push-action@v5
        with:
          context: ./collaboration-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-collaboration-service:latest

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs:
      - build-and-push-backend
      - build-and-push-frontend
      - build-and-push-gateway
      - build-and-push-voice-service
      - build-and-push-analytics-service
      - build-and-push-notifications-service
      - build-and-push-collaboration-service
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/classroom/"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd classroom
            sed -i 's|build: ./classroom-backend|image: ${{ secrets.DOCKER_USERNAME }}/classroom-backend:latest|g' docker-compose.yml
            sed -i 's|build: ./classroom-frontend|image: ${{ secrets.DOCKER_USERNAME }}/classroom-frontend:latest|g' docker-compose.yml
            sed -i 's|build: ./gateway-service|image: ${{ secrets.DOCKER_USERNAME }}/classroom-gateway-service:latest|g' docker-compose.yml
            sed -i 's|build: ./voice-service|image: ${{ secrets.DOCKER_USERNAME }}/classroom-voice-service:latest|g' docker-compose.yml
            sed -i 's|build: ./analytics-service|image: ${{ secrets.DOCKER_USERNAME }}/classroom-analytics-service:latest|g' docker-compose.yml
            sed -i 's|build: ./notifications-service|image: ${{ secrets.DOCKER_USERNAME }}/classroom-notifications-service:latest|g' docker-compose.yml
            sed -i 's|build: ./collaboration-service|image: ${{ secrets.DOCKER_USERNAME }}/classroom-collaboration-service:latest|g' docker-compose.yml
            docker compose pull
            docker compose up -d
            sleep 20
            docker exec backend npx drizzle-kit migrate