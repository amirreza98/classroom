name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./classroom-backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-backend:latest

  build-and-push-voice-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push voice service
        uses: docker/build-push-action@v5
        with:
          context: ./voice-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/classroom-voice-service:latest

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: [build-and-push-backend, build-and-push-voice-service]
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd classroom
            docker-compose pull
            docker-compose up -d